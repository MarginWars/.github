name: Bug
description: Something is wrong in this repository
title: 'Bug: '
labels:
- bug
body:
- type: markdown
  attributes:
    value: 'Public repo: no personal data, secrets or private names. Use first names and `{{profile.*}}` placeholders.'
- type: textarea
  id: what
  attributes:
    label: What is wrong
  validations:
    required: true
- type: textarea
  id: where
  attributes:
    label: Where (file, page or URL)
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What you expected
  validations:
    required: false
